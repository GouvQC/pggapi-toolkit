# File: task-apic-notification-nouvelle-version-product-courriel-message.yml
# Task: Prépare les courriels à envoyer aux abonnés du Produit pour les informer qu'une nouvelle version du produit est disponible

parameters:
  # Chemin complet vers le modèle de courriel à utiliser
  - name: CICD_TEMPLATE_PATH
    type: string
  # Nom du catalogue APIC dans lequel le produit a été déployé
  - name: CICD_APIC_RESSOURCE_CATALOG_NAME
    type: string
  # Nom du produit API déployé
  - name: CICD_PRODUCT_NAME
    type: string
  # Version du produit API déployé
  - name: CICD_PRODUCT_VERSION
    type: string

steps:
  - task: Bash@3
    displayName: "Préparer les courriels"

    inputs:
      targetType: inline

      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        INPUT_FILE="${SUBSCRIBERLISTFILE:-}"

        if [[ -z "${INPUT_FILE}" ]]; then
          echo "ERREUR : INPUT_FILE est vide."
          exit 1
        fi

        if [[ ! -f "${INPUT_FILE}" ]]; then
          echo "ERREUR : fichier abonnés introuvable"
          echo "${INPUT_FILE}"
          exit 1
        fi

        if [[ ! -f "${TEMPLATE_PATH}" ]]; then
          echo "ERREUR : modèle de courriel introuvable"
          echo "${TEMPLATE_PATH}"
          exit 1
        fi

        mkdir -p "${OUTPUT_DIR}"

        JSONL_FILE="${OUTPUT_DIR}/emails-to-send.jsonl"
        FINAL_FILE="${OUTPUT_DIR}/emails-to-send.json"

        rm -f "${JSONL_FILE}" "${FINAL_FILE}"
        touch "${JSONL_FILE}"

        echo "Génération des courriels..."

        jq -c '.[]' "${INPUT_FILE}" | while read -r ITEM
        do
          EMAIL=$(echo "${ITEM}" | jq -r '.email')

          SUBJECT=$(yq -r '.subject' "${TEMPLATE_PATH}")
          BODY=$(yq -r '.body' "${TEMPLATE_PATH}")

          SUBJECT=$(echo "${SUBJECT}" \
            | sed "s/{{PRODUCT_NAME}}/${PRODUCT_NAME}/g")

          BODY=$(echo "${BODY}" \
            | sed "s/{{PRODUCT_NAME}}/${PRODUCT_NAME}/g" \
            | sed "s/{{PRODUCT_VERSION}}/${PRODUCT_VERSION}/g" \
            | sed "s/{{CATALOG_NAME}}/${CATALOG_NAME}/g")

          jq -n \
            --arg to "${EMAIL}" \
            --arg subject "${SUBJECT}" \
            --arg body "${BODY}" \
            '{
              to: $to,
              subject: $subject,
              body: $body
            }' >> "${JSONL_FILE}"
        done

        if [[ -s "${JSONL_FILE}" ]]; then
          jq -s '.' "${JSONL_FILE}" > "${FINAL_FILE}"
        else
          echo "[]" > "${FINAL_FILE}"
        fi

        COUNT=$(jq 'length' "${FINAL_FILE}")

        echo "Nombre de courriels préparés : ${COUNT}"

        echo "##vso[task.setvariable variable=EmailsToSendFile]${FINAL_FILE}"

    env:
      TEMPLATE_PATH: ${{ parameters.CICD_TEMPLATE_PATH }}
      PRODUCT_NAME: ${{ parameters.CICD_PRODUCT_NAME }}
      PRODUCT_VERSION: ${{ parameters.CICD_PRODUCT_VERSION }}
      CATALOG_NAME: ${{ parameters.CICD_APIC_RESSOURCE_CATALOG_NAME }}
      OUTPUT_DIR: $(System.DefaultWorkingDirectory)/apic-send-email